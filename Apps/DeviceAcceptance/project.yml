name: QingzhouDeviceAcceptance
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: UK7MME38H9
    CODE_SIGN_STYLE: Automatic
targets:
  QingzhouDeviceAcceptance:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbraveyoung.qingzhou.deviceacceptance
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ""
schemes:
  QingzhouDeviceAcceptance:
    build:
      targets:
        QingzhouDeviceAcceptance: [test]
    test:
      config: Debug
      targets:
        - name: QingzhouDeviceAcceptance
          parallelizable: false
      captureScreenshotsAutomatically: true
      deleteScreenshotsWhenEachTestSucceeds: false
