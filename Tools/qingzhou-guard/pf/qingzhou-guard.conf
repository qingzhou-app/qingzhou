#!/bin/sh
# 断网开关的 pf 规则模板。
#
# 由 guard-run.sh 用 `pfctl -f` 灌进锚点 com.apple/qingzhou_guard（不改 /etc/pf.conf：
# 系统默认配置里已有 `anchor "com.apple/*"`，我们把锚点挂在那下面）。
#
# 设计前提（实测）：轻舟的 xray 跑在隧道扩展里，uid = 501，和普通程序同一个身份。
# 因此「只放行 root」这条规则能成立的前提是：**代理的所有出站都先连 127.0.0.1 上的
# root 中继**，由中继以 root 身份拨号。串好中继之前打开这份规则 = 立刻断网。
#
# 规则顺序（quick，命中即停）：
#   1. 回环 —— 代理连中继走这里
#   2. 局域网 / 保留段 / 组播 / 广播 —— 需求要求「只留局域网能通」
#   3. root —— 中继自己的出站
#   4. 其余一律拒绝 —— 普通程序（含隧道里的 xray，若它试图直接出网）当场丢弃
#
# 没有检测、没有切换：隧道消失后普通程序没有任何可用出口，所以不存在窗口。

# ---- 1. 回环 ----
pass out quick on lo0 all
pass in  quick on lo0 all

# ---- 2. 局域网与保留地址（IPv4）----
pass out quick inet to 10.0.0.0/8
pass out quick inet to 172.16.0.0/12
pass out quick inet to 192.168.0.0/16
pass out quick inet to 169.254.0.0/16
pass out quick inet to 100.64.0.0/10
pass out quick inet to 224.0.0.0/4
pass out quick inet to 255.255.255.255

# ---- 2b. 局域网与保留地址（IPv6）----
pass out quick inet6 to fe80::/10
pass out quick inet6 to fc00::/7
pass out quick inet6 to ff00::/8

# ---- 3. root 出站（中继）----
pass out quick user root

# ---- 4. 兜底：其余全部拒绝 ----
block out quick all
