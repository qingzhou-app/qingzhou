#!/bin/sh
# 断网开关的 pf 规则模板。
#
# 由 guard-run.sh 把 `__TUN_DEV__` 替换成轻舟当前的 utun 设备名后灌进锚点
# com.apple/qingzhou_guard（不改 /etc/pf.conf：系统默认配置里已有 `anchor "com.apple/*"`）。
# 当 `$BASE/enabled` 存在但 utun 尚未就绪或重连中时，guard-run.sh 会剥离
# `__TUN_DEV__` 行加载 fail-closed 基础规则（仅放行 lo0 / 局域网 / root），消除启动泄漏窗口。
#
# ## 为什么必须显式放行「进隧道的包」
#
# App 把包交给虚拟网卡时，在 pf 眼里是一条 `out` 方向、出接口 = utunN 的包，
# 而它的 uid 是 501（和 App 自己一样）。所以「拒绝 uid 501 的一切出站」如果不先放行
# utun，会把**所有 App 的正常上网**也一起掐断 —— 隧道本身就成了被拦的对象。
#
# 只放行**轻舟那一块** utun（按地址 10.0.10.1 识别），不放行 `utun*`：
# 这台机器上还有 utun0–utun5、utun7 等其它隧道接口，各自带着 IPv6 默认路由。
# 一旦放行通配，轻舟挂掉后流量可能被它们接走 —— 那正是"漏"。
#
# ## 为什么不放行 fc00::/7
#
# utun7 的网关是 fdd2:1adc:13e8::（落在 fc00::/7 里）。放行整个 ULA 段等于给这条
# 未知隧道开后门。局域网/链路本地只需要 fe80::/10 与组播 ff00::/8。
#
# 顺序（quick，命中即停）：
#   1. 回环        —— 代理连 root 中继走这里
#   2. 轻舟的 utun —— App 的正常流量
#   3. 局域网/保留 —— 需求要求「只留局域网能通」
#   4. root        —— 中继自己的出站
#   5. 其余全拒    —— 没有检测、没有切换，所以没有窗口

# ---- 1. 回环 ----
pass out quick on lo0 all
pass in  quick on lo0 all

# ---- 2. 轻舟的隧道设备（由 guard-run.sh 替换）----
pass out quick on __TUN_DEV__ all

# ---- 3. 局域网与保留地址（IPv4）----
pass out quick inet to 10.0.0.0/8
pass out quick inet to 172.16.0.0/12
pass out quick inet to 192.168.0.0/16
pass out quick inet to 169.254.0.0/16
pass out quick inet to 100.64.0.0/10
pass out quick inet to 224.0.0.0/4
pass out quick inet to 255.255.255.255

# ---- 3b. 链路本地与组播（IPv6）----
# 注意：故意不含 fc00::/7（见文件头）。
pass out quick inet6 to fe80::/10
pass out quick inet6 to ff00::/8

# ---- 4. root 出站（中继）----
pass out quick user root

# ---- 5. 兜底 ----
block out quick all
